server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Behind the edge proxy: redirect with a relative Location, never this container's host:8080.
  absolute_redirect off;

  # Security headers. Adjust connect-src to your API origin(s).
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Deployed build, checked by the Jenkins smoke test. Never cached.
  location = /version.json {
    add_header Cache-Control "no-store";
    try_files /version.json =404;
  }

  # vendor.thenearbyshop.com used to serve tnbs-vendor-service (a static dashboard). Keep its bookmarked
  # URLs working by sending them to the equivalent page here.
  # (/login/ and /dashboard/ need nothing: the app treats them like /login and /dashboard.)
  location ~ ^/vendors/login/?$ { return 301 /login; }
  location ~ ^/vendors/dashboard/?$ { return 301 /dashboard; }
  location ~ ^/(vendors/)?onboarding/store-setup/?$ { return 301 /onboarding; }
  location ~ ^/vendors(/.*)?$ { return 301 /; }

  # Hashed build assets can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: refreshing /orders/123 must serve index.html, not 404.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
