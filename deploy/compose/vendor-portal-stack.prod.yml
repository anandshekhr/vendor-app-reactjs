# Production vendor portal -- see vendor-portal-stack.yml. A separate compose project so a staging
# deploy can never touch production. Service is `vendor-portal-prod` so its DNS alias on the shared
# webnet doesn't collide with staging's (same pattern as web / web-prod in api-services).
#
# Served publicly on vendor.thenearbyshop.com: the edge (api-services deploy/nginx/api-stage.conf) proxies it to
# http://vendor-portal-prod:8080.
name: vendor-portal-stack-prod

services:
  vendor-portal-prod:
    build:
      context: ../..
      args:
        VITE_API_BASE_URL: https://api.thenearbyshop.com
        APP_VERSION: ${APP_VERSION:-unknown}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    # Jenkins names each build tnbs-vendor-portal:prod-<version> and keeps the newest five, so
    # ACTION=rollback can start an earlier one without rebuilding.
    image: ${PORTAL_IMAGE:-tnbs-vendor-portal:production}
    container_name: vendor_portal_prod
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - webnet

networks:
  webnet:
    external: true
    name: webnet
