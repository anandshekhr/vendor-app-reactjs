# Staging vendor portal -- this repo's React app (static files served by nginx), deployed by
# deploy/jenkins/Jenkinsfile.vendor-portal. It replaces tnbs-vendor-service on vendor.thenearbyshop.com.
#
# Staging build (calls staging-api). It has no public hostname: vendor.thenearbyshop.com is served by the
# production build (vendor-portal-stack.prod.yml). No host port is published, so nobody can bypass TLS. The API origin is baked into the bundle at build time (Vite), so staging and production
# are separate images.
name: vendor-portal-stack

services:
  vendor-portal:
    build:
      context: ../..
      args:
        VITE_API_BASE_URL: https://staging-api.thenearbyshop.com
        APP_VERSION: ${APP_VERSION:-unknown}
    image: tnbs-vendor-portal:staging
    container_name: vendor_portal
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - webnet

networks:
  webnet:
    external: true
    name: webnet
